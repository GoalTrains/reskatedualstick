; Dual Stick Controls for reSkate v6.4 - fresh-install settings

; Edit while the game is running: changes are picked up within 2 seconds.

[SessionControls]
; Camera: tap D-pad left/right; hold 0.5 seconds for the original action.
; Automatically uses manual side switching and removes camera switching from L3.
DpadCameraSide=1
DisableHoldFakie=1
FakieReturn=1

; In-game settings menu (v0.24): press this key to open / close it. End, Home, Insert, Delete,

; PageUp, PageDown, F1-F12, Pause, a letter or digit, or a key code like 0x23.

MenuKey=End

; Menu window and text size, percent (75-250). Also changeable in the menu itself.

MenuScale=100

; Legacy option retained for old settings. The game-owned separate window is always used

; to protect ReSkate graphics hooks, even before ReSkate has loaded.

MenuInGame=0

; PlayStation pads: 1 = the mod reads a DualSense / DualShock 4 itself and gives it to the game as

; an Xbox controller (no haptics / adaptive triggers). 2 = NATIVE (v5.23, test): the game keeps its

; own DualSense support - haptics, adaptive triggers, light bar, PS prompts - and the mod rewrites

; the sticks / buttons in what the game reads. Turn Steam Input off for the pad; USB works best.

; Needs a game restart. 0 = off (Steam Input / DS4Windows / DSX instead).

PlayStationPads=1

; Base physical-foot ownership: regular = left front; goofy = right front.

; The selected layout determines switch jobs and input directions.

; v3.9: AutoStance=1 = follow the stance you picked in the game (regular / goofy), read from your

; reSkate profile every few seconds. 0 = use Stance= above. In the End menu: Stance AUTO / REGULAR / GOOFY.

; (On Linux / Proton the game's setting may not be readable: then Stance= is used.)

Stance=regular

AutoStance=1

; Stick layout (v5.26, also in the End menu). 0 = LEFT / RIGHT FOOT: each stick is one of

; your feet, so goofy puts the left stick on your back foot (and TRUE FOOT swaps them riding switch).

; 1 = FRONT / BACK FOOT (fresh-install default): the left stick is always your front foot, goofy and switch too.

FrontBackFoot=1

; Third layout: 1 = SKATER XL, physical feet with fixed stick directions across switch.

; Regular: L UP/R DOWN. Goofy: L DOWN/R UP. Ollie/nollie jobs swap in switch.

; Selecting the XL preset sets this to 1; Session / Left-Right layouts set 0.

; This selects Left/Right ownership and swap jobs in switch automatically.

XLFootDirections=0

; Optional Custom-page switch directions. These do not swap feet or reverse steering.

SwitchInvertX=0

SwitchInvertY=0

; 1 = Dual Stick controls on when the game starts. Hold LB+RB+L3+R3 for

; ToggleHoldMs (3000 = 3 s) is the master on/off.

EnabledAtStart=1

ToggleHoldMs=3000

; 1 = read the game's own on/off-board state (through reSkate's physics hook), so walking and

; riding switch by themselves, bails included. If it can't start, the log says why and

; BoardButton below is used instead.

BoardDetect=1

; Fallback when board detection is off or unavailable: the button that gets you on / off the board.

BoardButton=Y

; How far a foot stick must move before it takes over the flick stick / counts as a pop (percent).

PopFlickPercent=30

; 360 flip / laser motion: start the popping foot out to the SIDE or a diagonal instead of

; straight down, sweep it into the crouch, then flick the other foot (skate.'s own motion).

; A press closer than this many degrees to straight down is a normal pop. 0 = off.

WindUpDegrees=60

; Pop style (also "Pop style" in the End menu). 0 = FLICK (Session: crouch with one foot,

; flick the other foot to pop). 1 = RELEASE (Skater XL: crouch all the way with one foot, then

; just let go of that stick to pop). Flicking the other foot still works in both.

PopOnRelease=0

; One-stick flips (v5.27, also in the End menu). 0 = BLOCKED (default): a stick on its own can scoop

; shove-its, 360 shove-its and impossibles (a full circle over the top) but not sweep into a heelflip /

; kickflip / tre - flips need both feet. 1 = ALLOWED: no limit.

OneFootFlips=0

; Stick steering (v5.15, also in the End menu). 1 = Skater XL style: rolling with the back foot let

; go, push the front-foot stick sideways to turn (the triggers still work too). Let it back to the

; middle before popping or flicking with it. 0 = off (default): turn with LT / RT only.

; 0 off, 1 front-foot stick, 2 physical left stick (Custom > Stick steering).

StickSteering=0
; Steering starts within this many degrees of straight sideways (5-60).
; Lower gives diagonal scoop setups more room; try 20. 34 preserves the old zone.
StickSteeringAngleDegrees=34
; Research recorder only; does not enable manual catch or change game physics.
; Adds validated native trick/landing-permission flags to the bounded input CSV.
; Read-only catch/dark/upright/edge-landing/wipeout flags; bounded input CSV.
CatchDiagnostics=0

; How far a stick may be pushed up / down and still be a MANUAL lean (percent). Pushed further it is

; a CROUCH for the next pop (sent to the game as a full crouch, held back for 0.15 s after a landing).

ManualMaxPercent=85

; Air / grind controls (v0.19): once the game says you are in the air (or grinding), each foot moves

; its own end of the board, Session style: front foot = nose half, back foot = tail half, both

; feet together add up (both sideways = boardslide). AirDelayMs waits that long after the pop so

; the trick input is not disturbed. 0 = off.

AirControls=1
; Optional experimental fine foot positioning. 0 keeps current handling.
FineGrindControls=0
; Two-foot grind setup and independent nose/tail pressure.
SplitGrindControls=1
; Native grind diagnostic capture is off in release settings.
NativeGrindDiagnostics=0

AirDelayMs=120

; Log every state change of every skater the game updates (for tuning air / grind / switch).

StateLog=1

; Grabs: 0 = off, 1 = LB / RB grab, 2 = LB / RB, or a fully pulled trigger, grab

GrabMode=1

; Bumpers (LB / RB), v3.7: pressed ON THE GROUND = the real bumper, held as long as you hold it:

; hold it as you flick a trick = dark catch / darkslide (as in the stock controls), or a handplant

; riding up to a lip. Pressed IN THE AIR: hold = grab (after GrabHoldMs), quick tap = dark catch.

; Double-tap and hold in the air = the real bumper held. GrabDoubleTapMs=0 = old behaviour (any press grabs at once).

GrabDoubleTapMs=300

GrabHoldMs=100

; Powerslides: push the sticks sideways TOWARDS each other and hold = toe side powerslide; AWAY

; from each other = heel side. Activation is immediate; PowerslideDelayMs is ignored.

; Menu: Revert double-tap window (100-600 ms). Higher = more forgiving.

; v5.7 revert input (also in the End menu): 0 = off, 1 = double-tap LT / RT, 2 = squeeze BOTH

; triggers together (default; reverts towards the trigger pressed first).

RevertInput=2

; to the right, drawn in RevertSpinMs. A single trigger press still steers.

Powerslides=1

PowerslideDelayMs=0

RevertDoubleTapMs=300

PowerslideFlip=0

RevertFlip=0

RevertSpinMs=300

; Quick double taps: the revert waits until this long after the first tap was let go.

RevertGapMs=0

; Double taps quicker than this (ms from letting go to pressing again) are ignored. 0 = off.

RevertMinGapMs=0

; Revert stick motion: 1 = full circle from the top, 2 = bottom -> side -> top,

; 3 = top -> side -> bottom, 4 = side -> bottom -> other side,

; 5 = (v5.1, measured from the stock controls) out to the SIDE, then a half circle down round the bottom to the other side;

; 6 = middle -> side -> part way round the bottom.

RevertShape=5

; Switch stance (on by default since v0.32, also in the End menu). After a 180 (read from the

; game) the front foot still pops the end in front of you. Stance follows the direct game field.

; A held ground manual keeps its existing mapping until the manual ends. 0 = off, 1 = on, 3 = TRUE FOOT (Skater XL / Session style: each stick stays on its

; foot, so in switch the sticks swap jobs; regular riding switch: left stick down + right stick up

; = switch ollie). 2 = on with kick / heel sides mirrored in switch (troubleshooting only, not in

; the menu). (Replaces the old SwitchFlip setting.)

SwitchStance=1

; v4.3: goofy riders: the game already handles switch for goofy, so the stick is NOT turned round

; (turning it made ollie / nollie the wrong way round). 1 = turn it round for goofy too.

SwitchFlipGoofy=0

; Stance source: 4 = direct stance field (v5.71 TEST); 1-3 = legacy probes.

SwitchSource=4

; Spin wind-up (v0.21): while crouched for an ollie / nollie, LT / RT winds up a spin (skate.'s

; prewind) instead of turning. 0 = off. 1 = the stock prewind (v3.4, copied from your own stock

; recording: ollie crouch = left stick down then round to the side, nollie = up then round),

; 2 = always down, 3 = straight out to the side, 4 = always up, 5 = 1 the other way round.

; SpinWindUpMs = how fast.

SpinWindUp=1

SpinWindUpMs=60

; Optional crouched steering: light trigger steers, strong pull winds up.

; Default 0 preserves existing pre-wind. Stock ramp mode uses stock handling.

SpinWindUpSteer=0

SpinWindUpTriggerPercent=70

; Rail / lip exit: centred L3 = left, R3 = right. Tilt a stick UP or DOWN and click that same stick for a vertical exit.

; How long the left stick is pushed to that side (ms).

GrindBumpMs=250

; Front / back flips (v3.2): click the FRONT foot's stick = front flip, the BACK foot's stick =

; backflip (regular: L3 front flip, R3 backflip). Click while crouched (it fires with the pop:

; the stock left stick UP for a front flip, DOWN for a backflip, held until you land) or in the air. Off a rail only; on a rail the clicks are still the bump-out. 0 = off.

BodyFlips=1

; v3.5: a flip also taps a grab, like the stock controls (front flip RT, backflip LT): this long (ms)

; from take-off. v3.6: 80 = a split second, hardly visible. Raise it if flips stop working.

BodyFlipGrabMs=80

GrabTriggerThreshold=250

; How far a foot stick must move before it counts at all (percent).

FootDeadzonePercent=15

; Trigger turning: strength (percent) and curve (100 = linear, 150 = softer near the start, max 300)

SteerStrengthPercent=100

SteerCurvePercent=100

; 1 = mirror every sideways flick and scoop (kickflip <-> heelflip). Only if yours come out the

; wrong way round - the stance setting already handles goofy. (Replaces FlipSideways.)

MirrorFlicks=0

; 1 = write every pop (foot, angle, strength, hold time) to session_controls.log, for tuning.

InputLog=1

; Stock input recorder (v3.3): with Dual Stick switched OFF, every move of your real

; sticks / triggers / buttons is written to the log with the game's state. 0 = off.

StockInputLog=1

; Stock ramp controls in Custom: OFF, AIR ONLY, or EARLY ON RAMP. Experimental grounded tilt cue.

; StockGrabAir=1 enables this; StockTransitionGround=0 selects AIR ONLY, 1 selects EARLY ON RAMP.

StockGrabAir=0

; Diagnostic labels: 0 OFF, 1 RAMP, 2 FLAT. Changing the label resets the bounded recording allowance.

RampDiagnostics=0

; Rail adjustment strength: 100 = old response, 120 = new default; range 50-200.

GrindSensitivityPercent=120

; Exact changed-poll raw/game input trace in session_controls_input.csv; 0 disables it.

PreciseInputLog=1

; While riding with sticks centred, hold R3 for the experimental stock R2 pumping crouch.

; Release uses a short analogue trigger fall. No forward-stick pump input is sent.

; Early stock handling during a qualifying ramp climb; enable through the menu.

StockTransitionGround=0

; Show the welcome/settings menu at startup; turn off from the menu if preferred.

ShowMenuOnStartup=1

; Regular-stance remount correction. Uses steady ground motion to recover riding direction

; while preserving Skate's native trick-input frame. 0 = previous stance reader.

RemountStanceMotion=1

; Developer remount snapshots; leave off for normal play.

RemountDiagnostics=0

; Read-only pose investigation (not a stance fix). Latest launch replaces the file.

; 10 Hz plus B/state edges, at most 6000 records (~266 MB). Save before relaunching.

StancePoseDiagnostics=0

; Experimental workaround: idle grounded brake pulse after a changed native menu stance frame.

; May slightly reduce speed; no animation/stance memory writes. Off by default.

MenuPoseRecovery=0

; Legacy pair-only experiment is disabled; this key is ignored.

NativeMenuPoseRestore=0

; Legacy frame recovery is disabled; the game overwrote this correction.

NativeMenuFrameRecovery=0

; Disabled legacy animation-property experiment; this key is ignored.

NativeMenuPropertyRecovery=0

; Disabled legacy animation reset request; this key is ignored.

NativeMenuAnimationReset=0

; Experimental native in-place respawn after the recorded menu pose mismatch.

; Stops movement; requests an on-board reset in the game's configured stance.

; OFF by default: recovery is visible and stops speed.

NativeMenuRespawnRecovery=0

; Experimental regular/goofy recovery: learn the rider mirror baseline and detect a grounded frame/mirror

; break that persists into a subsequent reversed-basis landing. Latest case needs in-game confirmation.

; Requires NativeMenuRespawnRecovery=1 to enable; leave both recovery options off for normal play.

; OFF by default for both regular and goofy.

NativeGroundPoseRecovery=0



; Optional rolling stance diagnostics; leave off for ordinary play.
StanceFlightRecorder=0

; Manual catch: retain flip/scoop input until L3/R3. Some tricks settle at an angle.
; Clean results still need catch timing; missed or mistimed catches can auto-catch awkwardly.
; OFF by default. Uses shared native held-flip release, not separate foot catches or dark catches.
ManualCatch=0

; Trick rotation speed is handled by Skate. The v6.3 speed override was removed.
; Keep the failed flick-replay and widened native hold-range experiments disabled.
ManualCatchReplay=0
ManualCatchNativeRanges=0
